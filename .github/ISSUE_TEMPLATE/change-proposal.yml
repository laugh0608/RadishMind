name: 变更提案
description: 提议产品、架构、协议、模型、评测、安全或仓库治理变化
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        提案用于澄清真实问题、证据、兼容性和停止线，不表示方案已经接受。安全漏洞请使用 SECURITY.md 中的私密报告入口。
  - type: dropdown
    id: area
    attributes:
      label: 主要领域
      options:
        - 用户工作区
        - 管理控制面与身份
        - 模型网关与 Provider
        - Workflow 与 Agent 运行时
        - RadishMind-Core、训练与评测
        - 图片理解、生成适配与产物
        - 跨项目协议与适配
        - 文档、脚本、CI 与仓库治理
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与用户价值
      description: 说明当前真实阻塞、目标用户和期望价值，不要先从实现偏好出发。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前基线与证据
      description: 指向当前焦点、功能专题、契约、代码或可复验记录，并区分事实、假设和未验证结论。
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: 目标与非目标
      description: 分别说明本提案必须解决和明确不解决的内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 描述 owner、流程、协议、数据边界、权限、失败语义和 UI 或运行时影响。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性、迁移与回滚
      description: 说明 schema、API、存储、模型、fixture、consumer、历史数据和失败恢复影响。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证与证据计划
      description: 给出正例、负例、边界条件、通过标准和无法由现有门禁承载的专项证据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与权衡
      description: 列出考虑过的方案、取舍和暂不采用的原因。
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我没有把候选、开发测试态能力或外部声明写成生产就绪。
          required: true
        - label: 若涉及 API、执行、身份、权限、Provider、schema 或用户数据，我已显式说明风险和停止线。
          required: true
        - label: 本提案不包含真实凭据、个人数据、敏感模型材料或无权提供的第三方内容。
          required: true
