name: radishmind-workbench
services:
  workbench:
    image: ${RADISHMIND_WORKBENCH_IMAGE:-radishmind-workbench:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.workbench
      args:
        BUILD_VERSION: ${RADISHMIND_WORKBENCH_BUILD_VERSION:-local-workbench-unversioned}
    user: "${RADISHMIND_WORKBENCH_UID:-10001}:${RADISHMIND_WORKBENCH_GID:-10001}"
    ports:
      - "127.0.0.1:${RADISHMIND_WORKBENCH_PORT:-4100}:7000"
    volumes:
      - type: bind
        source: ${RADISHMIND_WORKBENCH_CONFIG:-./workbench/platform.json}
        target: /etc/radishmind/platform.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RADISHMIND_WORKBENCH_DATA_DIR:-./workbench/data}
        target: /var/lib/radishmind
        bind:
          create_host_path: false
      - type: bind
        source: ${RADISHMIND_WORKBENCH_SECRETS_DIR:-./workbench/secrets}
        target: /run/secrets/radishmind
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
